name: Build and deploy gallery to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: pip install Pillow

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg has libvpx-vp9 (needed for video preview clips)
        run: ffmpeg -version && ffmpeg -encoders 2>&1 | grep -q libvpx-vp9

      # Restores the previous run's generated thumbnails/previews so
      # build_gallery.py only regenerates media that actually changed (it
      # compares git blob hashes, not mtimes -- every checkout gives files a
      # fresh mtime, so mtime comparison can't detect "unchanged" here). Cache
      # key includes the run number so every run also SAVES a fresh cache;
      # restore-keys falls back to the most recent prior cache regardless of
      # exact key match.
      - name: Restore thumbnail cache
        uses: actions/cache@v4
        with:
          path: site/thumbs
          key: gallery-thumbs-${{ github.run_id }}
          restore-keys: |
            gallery-thumbs-

      - name: Build gallery
        run: python3 scripts/build_gallery.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
